<title>研究日曆 · 請輸入密碼</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--txt:#e6edf3;--muted:#8b949e;--accent:#2f81f7;--err:#f85149}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:32px 28px;width:min(92vw,360px);text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.45)}
  .lock{font-size:40px;margin-bottom:6px}
  h1{font-size:18px;margin:0 0 4px}
  p.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
  input[type=password]{width:100%;padding:11px 12px;font-size:15px;border-radius:8px;border:1px solid var(--border);background:#0d1117;color:var(--txt);outline:none}
  input[type=password]:focus{border-color:var(--accent)}
  .row{display:flex;align-items:center;justify-content:center;gap:6px;margin:12px 0;color:var(--muted);font-size:13px}
  button{width:100%;margin-top:6px;padding:11px;font-size:15px;font-weight:600;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .err{color:var(--err);font-size:13px;min-height:18px;margin-top:10px}
  .note{color:var(--muted);font-size:11px;margin-top:18px;line-height:1.5}
</style>
</head>

<script>
(function(){
  var C={"group":"research","sessionKey":"dash_auth_research_session_v1","rememberKey":"dash_auth_research_remember_v1","logoutKey":"dash_auth_research_logout_v1","legacyKeys":["growth_pw","research_calendar_pw"]};
  var P=JSON.parse(document.getElementById('payload').textContent);
  function b64ToBytes(s){var bin=atob(s),n=bin.length,u=new Uint8Array(n);for(var i=0;i<n;i++){u[i]=bin.charCodeAt(i);}return u;}
  var MAX_PAYLOAD_BYTES=134217728,payloadProblem='',salt,iv,ct,enc=new TextEncoder();
  try{
    if(!P||!Number.isInteger(P.iter)||P.iter<10000||P.iter>10000000)throw new Error('invalid iter');
    if(P.v===1){
      if(P.codec!==undefined||P.plain_size!==undefined||P.encoded_size!==undefined)throw new Error('invalid v1 fields');
    }else if(P.v===2&&P.codec==='gzip'){
      if(!Number.isSafeInteger(P.plain_size)||P.plain_size<=0||P.plain_size>MAX_PAYLOAD_BYTES||!Number.isSafeInteger(P.encoded_size)||P.encoded_size<=0||P.encoded_size>MAX_PAYLOAD_BYTES)throw new Error('invalid v2 size');
    }else throw new Error('unsupported payload version or codec');
    salt=b64ToBytes(P.salt);iv=b64ToBytes(P.iv);ct=b64ToBytes(P.ct);
    if(salt.length!==16||iv.length!==12||ct.length<=16||ct.length>MAX_PAYLOAD_BYTES+16)throw new Error('invalid payload bytes');
    if(P.v===2&&ct.length!==P.encoded_size+16)throw new Error('ciphertext size mismatch');
  }catch(e){payloadProblem=e&&e.message?e.message:'invalid payload';}
  var btn=document.getElementById('btn'),err=document.getElementById('err'),pwEl=document.getElementById('pw'),remEl=document.getElementById('rem');
  var attempt=0,authorizedLogout='',hidden=false,unlocked=false,manualWithoutStorage=false;
  function read(storeName,key){try{var store=window[storeName];return{ok:true,value:store.getItem(key)}}catch(e){return{ok:false,value:null}}}
  function write(storeName,key,value){try{window[storeName].setItem(key,value);return true}catch(e){return false}}
  function remove(storeName,key){try{window[storeName].removeItem(key);return true}catch(e){return false}}
  function removeIfSame(storeName,key,raw){var current=read(storeName,key);if(current.ok&&current.value===raw)return remove(storeName,key);return false;}
  function logoutValue(){var result=read('localStorage',C.logoutKey);return result.ok?(result.value||''):null;}
  function parseCredential(raw,storeName,key){
    if(!raw)return null;
    try{
      var value=JSON.parse(raw);
      if(value&&value.v===1&&typeof value.password==='string'&&value.password&&typeof value.logout==='string'&&typeof value.remembered==='boolean')return value;
    }catch(e){}
    removeIfSame(storeName,key,raw);return null;
  }
  function setBusy(on){if(!btn)return;btn.disabled=on;btn.textContent=on?'解密中…':'進入';}
  function setError(message){if(err)err.textContent=message||'';}
  function showLock(){
    document.documentElement.style.visibility='';hidden=false;setBusy(false);
    if(pwEl){pwEl.focus();pwEl.select();}
  }
  function markerStillCurrent(marker){var current=logoutValue();return current===null||current===marker;}
  function clearLegacy(){for(var i=0;i<C.legacyKeys.length;i++)remove('localStorage',C.legacyKeys[i]);}
  function clearCredentialForGeneration(storeName,key,generation){
    var result=read(storeName,key),credential=result.ok?parseCredential(result.value,storeName,key):null;
    if(credential&&credential.logout===generation)removeIfSame(storeName,key,result.value);
  }
  function clearGroupForGeneration(generation,includeLegacy){
    clearCredentialForGeneration('sessionStorage',C.sessionKey,generation);
    clearCredentialForGeneration('localStorage',C.rememberKey,generation);
    if(includeLegacy)clearLegacy();
  }
  function newMarker(){
    var random='';try{var bytes=crypto.getRandomValues(new Uint8Array(12));for(var i=0;i<bytes.length;i++)random+=bytes[i].toString(16).padStart(2,'0');}catch(e){random=String(Math.random()).slice(2);}
    return String(Date.now())+'-'+random;
  }
  function relock(){attempt++;clearCredentialForGeneration('sessionStorage',C.sessionKey,authorizedLogout);location.reload();}
  function onStorage(ev){if(ev.key===null||(ev.key===C.logoutKey&&(ev.newValue||'')!==authorizedLogout))relock();}
  function onPageHide(){attempt++;hidden=true;document.documentElement.style.visibility='hidden';if(pwEl)pwEl.value='';}
  function onPageShow(ev){
    var current=logoutValue();
    if((ev.persisted||hidden)&&current!==null&&current!==authorizedLogout){relock();return;}
    if((ev.persisted||hidden)&&unlocked&&current===null&&!manualWithoutStorage){relock();return;}
    if((ev.persisted||hidden)&&unlocked&&!manualWithoutStorage&&!hasAuthorizedCredential()){relock();return;}
    if((ev.persisted||hidden)&&!unlocked){setError('');showLock();return;}
    document.documentElement.style.visibility='';hidden=false;
  }
  function installLifecycle(){
    window.removeEventListener('storage',onStorage);window.removeEventListener('pagehide',onPageHide);window.removeEventListener('pageshow',onPageShow);
    window.addEventListener('storage',onStorage);window.addEventListener('pagehide',onPageHide);window.addEventListener('pageshow',onPageShow);
  }
  async function decrypt(password){
    if(payloadProblem){var problem=new Error(payloadProblem);problem.dashCode='payload';throw problem;}
    var baseKey=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:P.iter,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['decrypt']);
    return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
  }
  async function decodePayload(ptBuf){
    if(P.v===1){if(ptBuf.byteLength>MAX_PAYLOAD_BYTES)throw new Error('v1 payload too large');return new Uint8Array(ptBuf);}
    if(typeof DecompressionStream!=='function'){var unsupported=new Error('DecompressionStream unavailable');unsupported.dashCode='unsupported';throw unsupported;}
    if(ptBuf.byteLength!==P.encoded_size){var encodedSize=new Error('encoded size mismatch');encodedSize.dashCode='payload';throw encodedSize;}
    var reader=new Blob([ptBuf]).stream().pipeThrough(new DecompressionStream('gzip')).getReader();
    var chunks=[],total=0;
    try{
      while(true){var item=await reader.read();if(item.done)break;total+=item.value.byteLength;if(total>P.plain_size||total>MAX_PAYLOAD_BYTES){try{await reader.cancel();}catch(_){}var tooLarge=new Error('decompressed payload exceeds declared size');tooLarge.dashCode='payload';throw tooLarge;}chunks.push(item.value);}
    }catch(e){if(!e.dashCode)e.dashCode='payload';throw e;}
    if(total!==P.plain_size){var plainSize=new Error('plain size mismatch');plainSize.dashCode='payload';throw plainSize;}
    var plain=new Uint8Array(total),offset=0;for(var i=0;i<chunks.length;i++){plain.set(chunks[i],offset);offset+=chunks[i].byteLength;}return plain;
  }
  function hasAuthorizedCredential(){
    var session=read('sessionStorage',C.sessionKey),remember=read('localStorage',C.rememberKey);
    if(!session.ok&&!remember.ok)return manualWithoutStorage;
    var first=session.ok?parseCredential(session.value,'sessionStorage',C.sessionKey):null;
    var second=remember.ok?parseCredential(remember.value,'localStorage',C.rememberKey):null;
    return !!((first&&first.logout===authorizedLogout)||(second&&second.logout===authorizedLogout));
  }
  function attachUnlockedRuntime(storageWarning,remembered){
    unlocked=true;installLifecycle();
    var current=logoutValue();
    if(current!==null&&current!==authorizedLogout){relock();return;}
    var old=document.getElementById('dash-auth-controls');if(old)old.remove();
    var style=document.createElement('style');style.id='dash-auth-runtime-style';
    style.textContent='#dash-auth-controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;margin:8px 0 12px;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}#dash-auth-logout{width:auto;margin:0;padding:7px 12px;border:1px solid #8b949e;border-radius:7px;background:transparent;color:inherit;font-family:inherit;font-size:14px;font-weight:600;line-height:1.2;cursor:pointer}#dash-auth-logout:focus-visible{outline:3px solid #2f81f7;outline-offset:2px}#dash-auth-storage-warning{flex-basis:100%;color:#b45309;font-size:13px;line-height:1.5;text-align:right}@media(max-width:520px){#dash-auth-controls{justify-content:stretch}#dash-auth-logout{min-height:44px;margin-left:auto}#dash-auth-storage-warning{text-align:left}}';
    document.head.appendChild(style);
    var controls=document.createElement('div');controls.id='dash-auth-controls';controls.setAttribute('data-auth-group',C.group);
    var logout=document.createElement('button');logout.id='dash-auth-logout';logout.type='button';logout.textContent='登出';logout.setAttribute('aria-label','登出研究網站');controls.appendChild(logout);
    if(storageWarning){var warning=document.createElement('div');warning.id='dash-auth-storage-warning';warning.setAttribute('role','status');warning.textContent='已解鎖,但此瀏覽器無法記住這台裝置。';controls.appendChild(warning);}
    var nav=document.querySelector('#ir-calendar-navigation, .research-nav');
    if(nav)nav.insertAdjacentElement('afterend',controls);else document.body.insertAdjacentElement('afterbegin',controls);
    logout.addEventListener('click',function(){
      attempt++;window.dispatchEvent(new CustomEvent('dash-auth-logout',{detail:{group:C.group}}));
      var oldGeneration=authorizedLogout,marker=newMarker();write('localStorage',C.logoutKey,marker);clearGroupForGeneration(oldGeneration,true);authorizedLogout=marker;location.reload();
    });
    window.dispatchEvent(new CustomEvent('dash-auth-unlocked',{detail:{group:C.group,remembered:remembered,storageWarning:storageWarning}}));
  }
  function saveCredential(password,remembered,marker,manual){
    var credential=JSON.stringify({v:1,password:password,logout:marker,remembered:remembered});
    var sessionOK=write('sessionStorage',C.sessionKey,credential),rememberOK=true;
    if(remembered)rememberOK=write('localStorage',C.rememberKey,credential);
    else if(manual)rememberOK=remove('localStorage',C.rememberKey);
    clearLegacy();
    manualWithoutStorage=manual&&!sessionOK&&!remembered;
    return{warning:remembered?!rememberOK:(!sessionOK||(manual&&!rememberOK)),persisted:sessionOK||(remembered&&rememberOK)};
  }
  async function tryDecrypt(password,remembered,source,manual){
    var token=++attempt,marker=logoutValue();if(marker===null)marker='';
    try{
      var ptBuf=await decrypt(password);
      if(token!==attempt||hidden)return'aborted';
      if(!markerStillCurrent(marker)){relock();return'aborted';}
      var plainBytes=await decodePayload(ptBuf);
      if(token!==attempt||hidden)return'aborted';
      if(!markerStillCurrent(marker)){relock();return'aborted';}
      var html;
      try{html=new TextDecoder('utf-8',{fatal:true}).decode(plainBytes);}catch(e){e.dashCode='payload';throw e;}
      if(token!==attempt||hidden)return'aborted';
      if(!markerStillCurrent(marker)){relock();return'aborted';}
      var saved=saveCredential(password,remembered,marker,manual);
      if(token!==attempt||!markerStillCurrent(marker)){relock();return'aborted';}
      authorizedLogout=marker;
      if(token!==attempt||hidden)return'aborted';
      if(!markerStillCurrent(marker)){relock();return'aborted';}
      document.open();document.write(html);document.close();
      manualWithoutStorage=manual&&!saved.persisted;
      attachUnlockedRuntime(saved.warning,remembered);
      return'ok';
    }catch(e){
      if(token!==attempt)return'aborted';
      if(e&&e.dashCode==='unsupported')return'unsupported';
      if(e&&e.dashCode==='payload')return'payload';
      if(e&&e.name==='OperationError'){
        if(source&&source.storeName&&source.key)removeIfSame(source.storeName,source.key,source.raw);
        return'wrong';
      }
      return'error';
    }
  }
  async function autoUnlock(){
    var current=logoutValue();if(current===null)current='';
    var candidates=[],session=read('sessionStorage',C.sessionKey),remember=read('localStorage',C.rememberKey);
    var sessionCredential=session.ok?parseCredential(session.value,'sessionStorage',C.sessionKey):null;
    var rememberCredential=remember.ok?parseCredential(remember.value,'localStorage',C.rememberKey):null;
    if(sessionCredential&&sessionCredential.logout===current)candidates.push({credential:sessionCredential,storeName:'sessionStorage',key:C.sessionKey,raw:session.value});
    else if(sessionCredential)removeIfSame('sessionStorage',C.sessionKey,session.value);
    if(rememberCredential&&rememberCredential.logout===current)candidates.push({credential:rememberCredential,storeName:'localStorage',key:C.rememberKey,raw:remember.value});
    else if(rememberCredential)removeIfSame('localStorage',C.rememberKey,remember.value);
    for(var i=0;i<C.legacyKeys.length;i++){
      var legacy=read('localStorage',C.legacyKeys[i]);
      if(legacy.ok&&legacy.value)candidates.push({credential:{password:legacy.value,remembered:true},storeName:'localStorage',key:C.legacyKeys[i],raw:legacy.value});
    }
    if(candidates.length===0){showLock();return;}
    setBusy(true);setError('');
    var sawWrong=false;
    for(var j=0;j<candidates.length;j++){
      var item=candidates[j],result=await tryDecrypt(item.credential.password,item.credential.remembered,item,false);
      if(result==='ok'||result==='aborted')return;
      if(result==='wrong'){sawWrong=true;continue;}
      if(result==='unsupported')setError('此瀏覽器不支援研究頁壓縮格式,請更新瀏覽器後再試');
      else if(result==='payload')setError('研究頁資料格式錯誤或已損壞,請稍後再試');
      else setError('瀏覽器無法完成解鎖,請重新整理後再試');
      showLock();return;
    }
    if(sawWrong)setError('已儲存的密碼已失效,請重新輸入');
    showLock();
  }
  installLifecycle();
  document.getElementById('f').addEventListener('submit',async function(ev){
    ev.preventDefault();if(!pwEl.value)return;
    var password=pwEl.value,remembered=!!(remEl&&remEl.checked);setError('');setBusy(true);
    var result=await tryDecrypt(password,remembered,null,true);
    if(result==='wrong'){setError('密碼錯誤,請再試一次');showLock();}
    else if(result==='unsupported'){setError('此瀏覽器不支援研究頁壓縮格式,請更新瀏覽器後再試');showLock();}
    else if(result==='payload'){setError('研究頁資料格式錯誤或已損壞,請稍後再試');showLock();}
    else if(result==='error'){setError('瀏覽器無法完成解鎖,請重新整理後再試');showLock();}
  });
  if(window.__DASH_AUTH_TEST__&&typeof window.__DASH_AUTH_TEST__.capture==='function'){
    window.__DASH_AUTH_TEST__.capture({tryDecrypt:tryDecrypt,decodePayload:decodePayload,onPageHide:onPageHide,onStorage:onStorage});
  }
  autoUnlock();
})();
